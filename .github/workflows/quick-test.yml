name: Quick Tests (PR Validation)

on:
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/quick-test.yml'

env:
  DOTNET_SDK_VERSION: '10.0.x'
  DOTNET_SDK_QUALITY: 'preview'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-validation:
    name: Quick Validation
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PowerShell
      # uses: PowerShell/setup-powershell@v2
      run: |
        $PSVersionTable.PSVersion

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
        dotnet-quality: ${{ env.DOTNET_SDK_QUALITY }}

    # The module intentionally fails closed if its Core-owned bridge is absent.
    # Build it before importing the module in the PowerShell test process.
    - name: Build WorkspaceBridge for PowerShell tests
      run: dotnet build src/Client/DistroNexus.WorkspaceBridge/DistroNexus.WorkspaceBridge.csproj --configuration Debug

    - name: Install Pester
      shell: pwsh
      run: |
        Install-Module -Name Pester -Repository PSGallery -Force -Scope CurrentUser -RequiredVersion 5.7.1 -AllowClobber

    - name: Run Quick PowerShell Tests
      shell: pwsh
      working-directory: ./tests/PowerShell
      run: |
        # Keep the quick lane on the repository's canonical Pester bootstrap.
        # It sets the required Pester runtime options for test child scopes.
        ./TestRunner.ps1 -TestType Unit -CI -OutputPath 'TestResults'

    - name: Build C# solution
      run: dotnet build src/Client/DistroNexus.slnx --configuration Debug

    - name: Run Quick C# Tests
      run: |
        # Run metadata-based quick scope and exclude full lane tests
        dotnet test src/Client/DistroNexus.Tests/DistroNexus.Tests.csproj `
          --configuration Debug `
          --no-build `
          --filter "TestScope!=Full" `
          --blame-hang `
          --blame-hang-timeout 5m `
          --results-directory test-results `
          --logger "trx;LogFileName=quick-csharp-results.trx"

    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      with:
        files: |
          test-results/*.trx
          TestResults/powershell-results.xml
        check_name: 'Quick Validation Tests'
        compare_to_earlier_commit: true
