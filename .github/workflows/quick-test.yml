name: Quick Tests (PR Validation)

on:
  pull_request:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/quick-test.yml'

env:
  DOTNET_SDK_VERSION: '10.0.x'
  DOTNET_SDK_QUALITY: 'preview'

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick-validation:
    name: Quick Validation
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PowerShell
      # uses: PowerShell/setup-powershell@v2
      run: |
        $PSVersionTable.PSVersion

    - name: Install Pester
      shell: pwsh
      run: |
        Install-Module -Name Pester -Repository PSGallery -Force -MinimumVersion 5.0

    - name: Run Quick PowerShell Tests
      shell: pwsh
      working-directory: ./tests/PowerShell
      run: |
        # Run quick metadata-selected unit scope
        $quickTestConfig = @{
          Run = @{
            Path = './Unit'
          }
          Filter = @{
            Tag = @('Unit')
            ExcludeTag = @('Integration', 'Slow', 'WSL2')
          }
          TestResult = @{
            Enabled = $true
            OutputPath = '../test-results/quick-pester-results.xml'
            OutputFormat = 'NUnitXml'
          }
        }
        
        $result = Invoke-Pester -Configuration $quickTestConfig
        
        if ($result.FailedCount -gt 0) {
          exit 1
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
        dotnet-quality: ${{ env.DOTNET_SDK_QUALITY }}

    - name: Build C# solution
      run: dotnet build src/Client/DistroNexus.slnx --configuration Debug

    - name: Run Quick C# Tests
      run: |
        # Run metadata-based quick scope and exclude full lane tests
        dotnet test src/Client/DistroNexus.Tests/DistroNexus.Tests.csproj `
          --configuration Debug `
          --no-build `
          --filter "TestScope!=Full" `
          --blame-hang `
          --blame-hang-timeout 5m `
          --results-directory test-results `
          --logger "trx;LogFileName=quick-csharp-results.trx"

    - name: Publish Test Results
      if: always()
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      with:
        files: test-results/*.trx, tests/test-results/*.xml
        check_name: 'Quick Validation Tests'
        compare_to_earlier_commit: true
