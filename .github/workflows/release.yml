name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without v prefix)'
        required: true
        default: '2.1.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Get version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $VERSION = "${{ github.event.inputs.version }}"
        } else {
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
        }
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "Building version: $VERSION"
      shell: pwsh

    - name: Verify Version consistency
      shell: pwsh
      run: |
        $Version = "${{ steps.version.outputs.VERSION }}"
        Write-Host "Verifying version: $Version"
        
        # 1. Check Directory.Build.props
        $propsContent = Get-Content src/Client/Directory.Build.props -Raw
        # Escape version for regex just in case it contains special chars like dots
        $EscapedVersion = [regex]::Escape($Version)
        
        if ($propsContent -notmatch "<Version>$EscapedVersion</Version>") {
            Write-Error "Version check failed: src/Client/Directory.Build.props does not contain <Version>$Version</Version>."
            exit 1
        }
        
        # 2. Check DistroNexus.psd1
        $psd1Content = Get-Content src/PowerShell/DistroNexus.psd1 -Raw
        if ($psd1Content -notmatch "ModuleVersion\s*=\s*['`"]$EscapedVersion['`"]") {
            Write-Error "Version check failed: src/PowerShell/DistroNexus.psd1 does not contain ModuleVersion = '$Version'."
            exit 1
        }
        
        # 3. Check installer.iss
        $issContent = Get-Content tools/installer.iss -Raw
        if ($issContent -notmatch "#define\s+MyAppVersion\s+`"$EscapedVersion`"") {
            Write-Error "Version check failed: tools/installer.iss does not contain #define MyAppVersion `"$Version`"."
            exit 1
        }

        # 4. Check website/package.json
        $pkgContent = Get-Content website/package.json -Raw
        if ($pkgContent -notmatch "`"version`":\s*`"$EscapedVersion`"") {
             Write-Error "Version check failed: website/package.json does not contain `"version`": `"$Version`"."
             exit 1
        }

        # 5. Check Store package identity (MSIX requires a fourth version component).
        $manifestContent = Get-Content src/DistroNexus.Package/Package.appxmanifest -Raw
        if ($manifestContent -notmatch "<Identity[\s\S]*?Version=`"$EscapedVersion\.0`"") {
            Write-Error "Version check failed: src/DistroNexus.Package/Package.appxmanifest does not contain Store version $Version.0."
            exit 1
        }

        Write-Host "All version checks passed."

    - name: Restore dependencies
      run: dotnet restore src/Client/DistroNexus.slnx

    - name: Build
      run: dotnet build src/Client/DistroNexus.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet test src/Client/DistroNexus.slnx --configuration Release --no-build --verbosity normal --filter "Category!=UIAutomation" --blame-hang --blame-hang-timeout 8m

    - name: Build portable package (framework-dependent)
      run: |
        ./tools/build.ps1 -Configuration Release -Publish -CreateZip -Version ${{ steps.version.outputs.VERSION }}
      shell: pwsh

    - name: Build self-contained package
      run: |
        ./tools/build.ps1 -Configuration Release -Publish -SelfContained -CreateZip -Version ${{ steps.version.outputs.VERSION }}
      shell: pwsh

    - name: Build Microsoft Store package
      run: |
        ./tools/build.ps1 -Configuration Release -StoreBuild -Version ${{ steps.version.outputs.VERSION }}
      shell: pwsh

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress -y
      shell: pwsh
      continue-on-error: true

    - name: Build installer
      run: |
        ./tools/build-installer.ps1 -Version ${{ steps.version.outputs.VERSION }}
      shell: pwsh

    - name: List release artifacts
      run: |
        Get-ChildItem release -Recurse | Select-Object FullName, Length
      shell: pwsh

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body_path: docs/release_notes/v${{ steps.version.outputs.VERSION }}.md
        files: |
          release/*.zip
          release/installer/*.exe
          release/store/**/*.msixbundle
          release/store/**/*.msixupload
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts (for manual builds)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: DistroNexus-v${{ steps.version.outputs.VERSION }}
        path: |
          release/*.zip
          release/installer/*.exe
          release/store/**/*.msixbundle
          release/store/**/*.msixupload
        retention-days: 30
