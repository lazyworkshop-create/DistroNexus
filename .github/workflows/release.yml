name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (without v prefix)'
        required: true
        default: '2.0.0'

jobs:
  build-and-release:
    name: Build and Release
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Get version
      id: version
      run: |
        if ("${{ github.event_name }}" -eq "workflow_dispatch") {
          $VERSION = "${{ github.event.inputs.version }}"
        } else {
          $VERSION = "${{ github.ref_name }}".TrimStart('v')
        }
        echo "VERSION=$VERSION" >> $env:GITHUB_OUTPUT
        echo "Building version: $VERSION"
      shell: pwsh

    - name: Restore dependencies
      run: dotnet restore src/Client/DistroNexus.slnx

    - name: Build
      run: dotnet build src/Client/DistroNexus.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet test src/Client/DistroNexus.slnx --configuration Release --no-build --verbosity normal
      continue-on-error: true

    - name: Build portable package (framework-dependent)
      run: |
        ./tools/build.ps1 -Configuration Release -Publish -CreateZip -Version ${{ steps.version.outputs.VERSION }}
      shell: pwsh

    - name: Build self-contained package
      run: |
        ./tools/build.ps1 -Configuration Release -Publish -SelfContained -CreateZip -Version ${{ steps.version.outputs.VERSION }}
      shell: pwsh

    - name: Install Inno Setup
      run: |
        choco install innosetup --no-progress -y
      shell: pwsh
      continue-on-error: true

    - name: Build installer
      run: |
        ./tools/build-installer.ps1 -Version ${{ steps.version.outputs.VERSION }}
      shell: pwsh
      continue-on-error: true

    - name: List release artifacts
      run: |
        Get-ChildItem release -Recurse | Select-Object FullName, Length
      shell: pwsh

    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        body_path: docs/release_notes/v${{ steps.version.outputs.VERSION }}.md
        files: |
          release/*.zip
          release/installer/*.exe
        fail_on_unmatched_files: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts (for manual builds)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: DistroNexus-v${{ steps.version.outputs.VERSION }}
        path: |
          release/*.zip
          release/installer/*.exe
        retention-days: 30
