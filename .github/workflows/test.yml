name: Integration Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  DOTNET_SDK_VERSION: '10.0.x'
  DOTNET_SDK_QUALITY: 'preview'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-powershell:
    name: PowerShell Module Tests
    runs-on: windows-latest
    strategy:
      matrix:
        powershell-version: ['7.2', 'latest']
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PowerShell
      # uses: PowerShell/setup-powershell@v2
      run: |
        $PSVersionTable.PSVersion

    - name: Install Pester
      shell: pwsh
      run: |
        Install-Module -Name Pester -Repository PSGallery -Force -MinimumVersion 5.0

    - name: Run PowerShell Unit Tests
      shell: pwsh
      working-directory: ./tests/PowerShell
      run: |
        # Run unit tests
        $unitTestConfig = @{
          Run = @{
            Path = './Unit'
          }
          Filter = @{
            Tag = @('Unit')
          }
          TestResult = @{
            Enabled = $true
            OutputPath = '../test-results/pester-unit-results.xml'
            OutputFormat = 'NUnitXml'
          }
          CodeCoverage = @{
            Enabled = $true
            OutputPath = '../test-results/pester-unit-coverage.xml'
            OutputFormat = 'CoverageGutters'
            CoveragePercentTarget = 0
            Path = '../../src/PowerShell/Public', '../../src/PowerShell/Private'
          }
        }
        
        $result = Invoke-Pester -Configuration $unitTestConfig

        if ($result.TotalCount -eq 0) {
          Write-Warning "No tests matched tag 'Unit'. Falling back to all tests under ./Unit."
          $unitTestConfig.Filter = @{}
          $result = Invoke-Pester -Configuration $unitTestConfig
        }
        
        if ($result.FailedCount -gt 0) {
          exit 1
        }

    - name: Run PowerShell Integration Tests
      shell: pwsh
      working-directory: ./tests/PowerShell
      run: |
        # Run integration tests
        $integrationTestConfig = @{
          Run = @{
            Path = './Integration'
          }
          Filter = @{
            Tag = @('Integration')
          }
          TestResult = @{
            Enabled = $true
            OutputPath = '../test-results/pester-integration-results.xml'
            OutputFormat = 'NUnitXml'
          }
          CodeCoverage = @{
            Enabled = $true
            OutputPath = '../test-results/pester-integration-coverage.xml'
            OutputFormat = 'CoverageGutters'
            CoveragePercentTarget = 0
            Path = '../../src/PowerShell'
          }
        }
        
        $result = Invoke-Pester -Configuration $integrationTestConfig
        
        if ($result.FailedCount -gt 0) {
          exit 1
        }

    - name: Upload PowerShell Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: powershell-test-results-${{ matrix.powershell-version }}
        path: tests/test-results/

    - name: Publish PowerShell Test Results
      if: always() && hashFiles('tests/test-results/**/*.xml') != ''
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      continue-on-error: true
      with:
        files: tests/test-results/*-results.xml
        check_name: 'PowerShell Tests (${{ matrix.powershell-version }})'

  test-csharp:
    name: C# Integration Tests
    runs-on: windows-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
        dotnet-quality: ${{ env.DOTNET_SDK_QUALITY }}

    - name: Restore dependencies
      run: dotnet restore src/Client/DistroNexus.slnx

    - name: Build C# solution
      run: dotnet build src/Client/DistroNexus.slnx --configuration Release --no-restore

    - name: Run C# Unit Tests
      run: |
        dotnet test src/Client/DistroNexus.Tests/DistroNexus.Tests.csproj `
          --configuration Release `
          --no-build `
          --verbosity normal `
          --filter "TestScope!=Full" `
          --blame-hang `
          --blame-hang-timeout 5m `
          --results-directory test-results `
          --logger "trx;LogFileName=csharp-unit-results.trx"

    - name: Run C# Integration Tests
      run: |
        dotnet test src/Client/DistroNexus.Tests/DistroNexus.Tests.csproj `
          --configuration Release `
          --no-build `
          --verbosity normal `
          --filter "TestScope=Full&Category!=UIAutomation" `
          --blame-hang `
          --blame-hang-timeout 8m `
          --results-directory test-results `
          --logger "trx;LogFileName=csharp-integration-results.trx"

    - name: Upload C# Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: csharp-test-results
        path: test-results/

    - name: Publish C# Test Results
      if: always() && hashFiles('test-results/**/*.trx') != ''
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      continue-on-error: true
      with:
        files: test-results/**/*.trx
        check_name: 'C# Tests'

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: test-results/coverage.cobertura.xml
        flags: csharp
        name: C# Coverage
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

  generate-coverage-report:
    name: Generate Coverage Report
    runs-on: windows-latest
    needs: [test-powershell, test-csharp]
    if: always()

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download all test artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./coverage-artifacts/

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
        dotnet-quality: ${{ env.DOTNET_SDK_QUALITY }}

    - name: Install ReportGenerator
      run: |
        dotnet tool install -g dotnet-reportgenerator-globaltool

    - name: Generate HTML Coverage Report
      run: |
        $coverageFiles = Get-ChildItem -Path ./coverage-artifacts -Recurse -Include "coverage.cobertura.xml" -ErrorAction SilentlyContinue
        
        if ($coverageFiles) {
          $files = ($coverageFiles | ForEach-Object { $_.FullName }) -join ";"
          reportgenerator -reports:"$files" -targetdir:"./coverage-report" -reporttypes:"Html;HtmlSummary"
        }
      shell: pwsh

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-report/

    - name: Comment PR with Coverage Summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          // Try to read coverage summary
          const summaryPath = './coverage-report/Summary.html';
          let coverageSummary = 'Coverage report generated. See artifacts for details.';
          
          if (fs.existsSync(summaryPath)) {
            try {
              const htmlContent = fs.readFileSync(summaryPath, 'utf8');
              // Extract coverage percentage from HTML
              const match = htmlContent.match(/Coverage:\s*(\d+\.?\d*%)/i);
              if (match) {
                coverageSummary = `📊 **Coverage Report**: ${match[1]} covered`;
              }
            } catch (error) {
              console.log('Could not parse coverage summary');
            }
          }
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `## Test Results
          
          ✅ All tests completed
          
          ${coverageSummary}
          
          📝 Check the artifacts for detailed test results and coverage reports.`
          });

  summary:
    name: Test Summary
    runs-on: windows-latest
    needs: [test-powershell, test-csharp]
    if: always()

    steps:
    - name: Check Test Status
      run: |
        if ("${{ needs.test-powershell.result }}" -eq "failure" -or "${{ needs.test-csharp.result }}" -eq "failure") {
          Write-Host "::error::Tests failed"
          exit 1
        }
        Write-Host "✅ All tests passed!"
      shell: pwsh

    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Create test summary
      run: |
        $summary = @"
        # Integration Test Summary
        
        ## PowerShell Tests
        - Status: ${{ needs.test-powershell.result }}
        - Artifact: powershell-test-results
        
        ## C# Tests
        - Status: ${{ needs.test-csharp.result }}
        - Artifact: csharp-test-results
        
        ## Coverage Report
        - Report: coverage-report
        "@
        
        Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
      shell: pwsh
